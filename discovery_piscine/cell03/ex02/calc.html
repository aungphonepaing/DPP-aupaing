<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="calc.css">

    </head> 

    <body>
        <div class="calc">
            <input type="number" id="left">
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>

            <input type="number" id="right">
            <input type="submit" id="try" value="Try me!">
        </div>

        <script src="calc.js"></script>
    </body>
</html>
